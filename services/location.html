{% extends "base.html" %}

{% block title %}Set Location | Faithful{% endblock %}

{% block content %}

<section class="location-page">

    <h1>Set Your Location</h1>

    <p>
        Enter your location so Faithful can recommend nearby places of worship.
    </p>

    <form action="{{ url_for('save_location') }}" method="post">

        <div>
            <label for="city">City</label>

            <input
                type="text"
                id="city"
                name="city"
                value="{{ city|default('') }}"
                required
            >
        </div>

        <div>
            <label for="state">State</label>

            <input
                type="text"
                id="state"
                name="state"
                value="{{ state|default('') }}"
                required
            >
        </div>

        <div>
            <label for="country">Country</label>

            <input
                type="text"
                id="country"
                name="country"
                value="{{ country|default('') }}"
                required
            >
        </div>

        <button type="submit">
            Save Location
        </button>

    </form>

</section>

{% endblock %}
