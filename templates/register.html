{% extends "base.html" %}

{% block title %}Register | Faithful{% endblock %}

{% block content %}
<section class="auth-page">
    <h1>Create Your Account</h1>

    <p>
        Join Faithful to save your preferences and access personalized tools.
    </p>

    <form action="{{ url_for('register') }}" method="post">
        <div>
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ name|default('') }}"
                autocomplete="name"
                required
            >
        </div>

        <div>
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email|default('') }}"
                autocomplete="email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <div>
            <label for="confirm_password">Confirm password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Log in</a>
    </p>
</section>
{% endblock %}
