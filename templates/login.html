{% extends "base.html" %}

{% block title %}Log In | Faithful{% endblock %}

{% block content %}
<section class="auth-page">

    <h1>Welcome Back</h1>

    <p>Log in to continue your faith journey.</p>

    <form action="{{ url_for('login') }}" method="post">

        <div>
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ email|default('') }}"
                autocomplete="email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit">
            Log In
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one here</a>
    </p>

</section>
{% endblock %}
