<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
    <h1>{{ user.name }}</h1>

    <p>Email: {{ user.email }}</p>
    <p>Religion: {{ user.selected_religion or "Not selected" }}</p>
    <p>City: {{ user.city or "Not saved" }}</p>
    <p>State: {{ user.state or "Not saved" }}</p>
    <p>Country: {{ user.country or "Not saved" }}</p>
</body>
</html>
